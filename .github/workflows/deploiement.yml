name: Déploiement Cloudflare Pages

# Chaque poussée sur la branche par défaut met le site en ligne.
# Le déclenchement manuel sert à redéployer sans nouveau commit.
on:
  push:
    branches: [claude/sabi-site-dev-95r6po]
  workflow_dispatch:

# Un seul déploiement à la fois. Une poussée pendant un déploiement en cours
# annule le précédent plutôt que de publier deux versions dans le désordre.
concurrency:
  group: deploiement-pages
  cancel-in-progress: true

permissions:
  contents: read

env:
  NOM_PROJET: sabi-co
  BRANCHE_PRODUCTION: production
  DOMAINE: sabi-co.fr

jobs:
  deployer:
    name: Construire et déployer
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Vérifier que les secrets sont bien en place
        env:
          JETON: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          COMPTE: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          manquants=""
          [ -z "$JETON" ] && manquants="$manquants CLOUDFLARE_API_TOKEN"
          [ -z "$COMPTE" ] && manquants="$manquants CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$manquants" ]; then
            echo "::error::Secrets manquants :$manquants"
            echo "À créer dans Settings > Secrets and variables > Actions du dépôt."
            echo "Le jeton Cloudflare doit porter la permission Account > Cloudflare Pages > Edit."
            exit 1
          fi
          echo "Les deux secrets sont présents."

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le site
        run: npm run build

      - name: Créer le projet Pages si besoin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # La création échoue si le projet existe déjà, ce qui est le cas
          # normal à partir du deuxième déploiement. On laisse passer.
          npx --yes wrangler@4 pages project create "$NOM_PROJET" \
            --production-branch="$BRANCHE_PRODUCTION" || true

      - name: Déployer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy dist \
            --project-name="$NOM_PROJET" \
            --branch="$BRANCHE_PRODUCTION" \
            --commit-dirty=true

      - name: Rattacher le domaine
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash .github/scripts/domaine.sh

      - name: Rappeler les adresses
        run: |
          {
            echo "### Site déployé"
            echo ""
            echo "- https://$NOM_PROJET.pages.dev"
            echo "- https://$DOMAINE"
          } >> "$GITHUB_STEP_SUMMARY"
